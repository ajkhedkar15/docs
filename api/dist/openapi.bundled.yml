openapi: 3.0.3
info:
  title: myAuditPlan API Spec
  version: 4.0.0
  description: |
    Open API specification for myAuditPlan (mAP).

    ## Structure
    - **Shared** endpoints are at the root: current user, core AE info, saved filters, lookups.
    - **Each screen** has its own prefix (`/attribute-tagging`, later `/risk-assessment`, `/audit-plan` ...)
      and the same endpoints: `POST /aes/search` (list and filter), `GET /filters`,
      `GET /aes/{aeId}` (detail), and edit endpoints under `/aes/{aeId}/...`.

    ## Who is the caller
    - **Now (temporary):** the UI shows a "Who are you?" screen. The user picks themselves from
      `GET /users?q=`, and the UI sends that user's id in the `X-User-Id` header on every call.
      Enabled only with the backend `dev-auth` profile. It is not secure: anyone can send any id.
    - **Later:** a JWT bearer token. The backend reads the user from the token instead of the header;
      no endpoint, parameter or response changes.
    - Either way the user is **never** a query parameter or a body field.

    ## View vs edit
    - Every user can **view** every Auditable Entity (AE).
    - Only an AE owner (or an admin) can **edit** it.
    - Every AE in a response carries `canEdit`, computed by the server. The UI shows the rest read-only.
    - Edit endpoints re-check ownership and return **403** for non-owners. 404 means the AE does not exist.

    ## My AEs vs all AEs
    - Filter dropdowns always list every value across ALL AEs, for every user.
    - "My AEs" is just the **AE Owner** filter. The UI preselects it with the logged-in user,
      so the screen opens on their AEs. Removing it shows all AEs.
    - Search with no criteria returns all AEs.

    ## Search semantics
    Values inside one criterion are OR'ed; different criteria are AND'ed.
    `EXCLUDE` returns AEs that have none of the values.
    For `aeId` and `aeName` the values are AE ids (names can repeat).

    ## Filtering in the browser
    Each card has `filterValues`: the codes for every filter of the screen except aeId and aeName.
    The browser filters with `aeId`, `aeName`, `aeDescription` (search text) and `filterValues` only,
    and must give the same result as the server.

    ## Paging
    `page` starts at 1; `pageSize` defaults to 1000 and is capped at 1000.
    `aeId` is always added to the sort as a tiebreaker.

    ## Screen flow (same for every screen)
    1. On open: `GET /<screen>/filters` and `POST /<screen>/aes/search?page=1`
       with `{"criteria":[{"field":"aeOwner","values":["<my id>"]}]}` - the user's AEs, shown at once.
    2. In the background: `POST /<screen>/aes/search` with `{}`, page by page until `lastPage=true`
       (about 2,500 AEs, 3 pages). From then on, every filter change is applied in the browser.
    3. A filter change before the background load finishes is sent to `POST /<screen>/aes/search`.
    4. Click an AE: `GET /<screen>/aes/{aeId}`. Edit only when `canEdit` is true.
  license:
    name: Proprietary
servers:
  - url: https://myAuditPlan/api/v1
security:
  - devUserHeader: []
  - bearerAuth: []
tags:
  - name: Shared
    description: Users, current user, saved filters and lookups used by every screen
  - name: AttributeTagging
    description: Attribute Tagging screen - review and assign Apps, Models and Third Party tags
paths:
  /users:
    get:
      tags:
        - Shared
      summary: Find users (for the temporary "Who are you?" screen)
      description: |
        Contains-search on user name. Called without X-User-Id, because the user has not picked
        themselves yet. Will be removed or restricted once JWT login is in place.
      operationId: searchUsers
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
              example:
                - id: '12345'
                  name: John Smith
                - id: '12377'
                  name: Johanna Smithers
        '400':
          $ref: '#/components/responses/BadRequest'
  /me:
    get:
      tags:
        - Shared
      summary: Current user
      description: |
        Who the caller is: from X-User-Id for now, from the bearer token later.
        The UI calls this after the "Who are you?" screen to confirm the id is valid.
      operationId: getCurrentUser
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /saved-filters:
    get:
      tags:
        - Shared
      summary: The caller's saved filters for one screen
      operationId: getSavedFilters
      parameters:
        - name: screen
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScreenId'
      responses:
        '200':
          description: Saved filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedFilter'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Shared
      summary: Save the current filters
      operationId: createSavedFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterRequest'
            example:
              screen: attribute-tagging
              name: UK legal entities
              search:
                criteria:
                  - field: keyLegalEntity
                    values:
                      - LE-UK-01
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /saved-filters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Shared
      summary: Update one of the caller's saved filters
      operationId: updateSavedFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Shared
      summary: Delete one of the caller's saved filters
      operationId: deleteSavedFilter
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /lookups/{key}:
    get:
      tags:
        - Shared
      summary: All possible values of one list, for edit forms
      description: |
        Every value that can be assigned (for example every application), not only those already
        used on AEs. Filter dropdowns use the screen's /filters instead.
      operationId: getLookup
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FilterKey'
        - name: q
          in: query
          required: false
          description: Optional contains-search on value or label
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
              example:
                - value: APP-221
                  label: APP-221 Fund Ledger
                - value: APP-310
                  label: APP-310 NAV Calculator
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/aes/search:
    post:
      tags:
        - AttributeTagging
      summary: List, search and filter Attribute Tagging cards
      description: |
        The only list endpoint. An empty body {} returns all AEs.
        The screen opens with criteria aeOwner = [the user's id] (the AE Owner filter preselected).

        Filters on this screen - aeId, aeName, aeOwner, est, risk, keyLegalEntity, keyThirdParty,
        keyApplication, businessArea, businessDivision, keyModel, archerRiskUnit, costCenter,
        location, product, auditTeam.

        Sort fields - aeName, aeId, businessArea, modifiedOn.
      operationId: searchAttributeTaggingAes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              myAes:
                summary: Screen opens - AE Owner preselected with the user
                value:
                  criteria:
                    - field: aeOwner
                      values:
                        - '12345'
              allAes:
                summary: All AEs (owner filter removed)
                value: {}
              filtered:
                summary: Several filters
                value:
                  searchText: equity
                  criteria:
                    - field: aeName
                      values:
                        - '000000004561'
                        - '000000004890'
                    - field: keyLegalEntity
                      values:
                        - LE-UK-01
                    - field: costCenter
                      operator: EXCLUDE
                      values:
                        - CC-9999
      responses:
        '200':
          description: A page of AEs (empty items if none match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTaggingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/filters:
    get:
      tags:
        - AttributeTagging
      summary: Filter dropdowns for Attribute Tagging
      description: |
        Every value across ALL AEs, in screen order - not only the user's own AEs.
        The response is the same for every user, so the server caches it once.
      operationId: getAttributeTaggingFilters
      responses:
        '200':
          description: Filters in screen order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filter'
              example:
                - key: aeOwner
                  label: AE Owner
                  options:
                    - value: '12345'
                      label: John Smith
                      count: 37
                - key: aeName
                  label: AE Name
                  options:
                    - value: '000000004561'
                      label: State Street IM Systematic Equity
                      count: 1
                - key: keyLegalEntity
                  label: Key Legal Entities
                  options:
                    - value: LE-UK-01
                      label: Example Bank UK Ltd
                      count: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/aes/{aeId}:
    get:
      tags:
        - AttributeTagging
      summary: Attribute Tagging detail of one AE
      description: Any user can view. canEdit decides whether the edit form is shown.
      operationId: getAttributeTaggingAe
      parameters:
        - $ref: '#/components/parameters/AeId'
      responses:
        '200':
          description: The AE with labelled attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTaggingDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /attribute-tagging/aes/{aeId}/tags:
    put:
      tags:
        - AttributeTagging
      summary: Assign Application, Model and Third Party tags (owners only)
      description: Replaces the three tag lists. The server checks that the caller is an owner.
      operationId: updateAttributeTaggingTags
      parameters:
        - $ref: '#/components/parameters/AeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: Updated AE detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTaggingDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /attribute-tagging/aes/{aeId}/recommendations:
    get:
      tags:
        - AttributeTagging
      summary: Recommendations for one AE
      operationId: getAttributeTaggingRecommendations
      parameters:
        - $ref: '#/components/parameters/AeId'
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Planned. The token carries the user id and username.
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        Temporary, until JWT is in place. The id of the user picked on the "Who are you?" screen.
        Only accepted when the backend runs with the dev-auth profile. Not secure.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      required: false
      description: Page number (starts at 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Records per page (max 1000)
      schema:
        type: integer
        default: 1000
        minimum: 1
        maximum: 1000
    Sort:
      name: sort
      in: query
      required: false
      description: field,asc|desc. Allowed fields are listed per screen. aeId is always added as a tiebreaker.
      schema:
        type: string
        default: aeName,asc
    AeId:
      name: aeId
      in: path
      required: true
      description: AE id (string; keeps leading zeros)
      schema:
        type: string
        example: '000000004561'
  schemas:
    Person:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Stable user id (used for ownership checks)
          example: '12345'
        name:
          type: string
          example: John Smith
    ErrorResponse:
      type: object
      description: RFC 7807 problem detail (Spring ProblemDetail)
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required:
            - roles
          properties:
            roles:
              type: array
              items:
                type: string
              example:
                - AE_USER
    ScreenId:
      type: string
      description: Screen identifier. Add new screens here.
      enum:
        - attribute-tagging
    FilterKey:
      type: string
      description: |
        Catalog of every filter used across screens. Each screen accepts only its own subset
        (a filter the screen doesn't offer returns 400). Also used as the lookup type.
      enum:
        - aeId
        - aeName
        - aeOwner
        - est
        - risk
        - keyLegalEntity
        - keyThirdParty
        - keyApplication
        - businessArea
        - businessDivision
        - keyModel
        - archerRiskUnit
        - costCenter
        - location
        - product
        - auditTeam
    Criterion:
      type: object
      description: For aeId and aeName the values are AE ids; for aeOwner they are user ids.
      required:
        - field
        - values
      properties:
        field:
          $ref: '#/components/schemas/FilterKey'
        operator:
          type: string
          enum:
            - INCLUDE
            - EXCLUDE
          default: INCLUDE
        values:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
    SearchRequest:
      type: object
      description: |
        An empty body {} returns all AEs. The UI opens the screen with criteria aeOwner = [the user's id],
        so the user first sees their own AEs.
      properties:
        searchText:
          type: string
          maxLength: 100
          description: Case-insensitive contains match on aeId, aeName and aeDescription
        criteria:
          type: array
          maxItems: 15
          items:
            $ref: '#/components/schemas/Criterion'
    SavedFilterRequest:
      type: object
      required:
        - screen
        - name
        - search
      properties:
        screen:
          $ref: '#/components/schemas/ScreenId'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: UK legal entities
        search:
          $ref: '#/components/schemas/SearchRequest'
    SavedFilter:
      allOf:
        - $ref: '#/components/schemas/SavedFilterRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 42
            createdOn:
              type: string
              format: date-time
    Option:
      type: object
      description: A value and its display text. Used for filter options, lookups and labelled attributes.
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: Code or id. This is what is sent back to the API.
          example: LE-UK-01
        label:
          type: string
          description: Display text
          example: Example Bank UK Ltd
        count:
          type: integer
          description: Only in filter options - number of AEs (out of all AEs) with this value
          example: 12
    PageMeta:
      type: object
      description: Every list response has these fields plus `items`.
      required:
        - page
        - pageSize
        - totalRecords
        - totalPages
        - lastPage
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 1000
        totalRecords:
          type: integer
          example: 156
        totalPages:
          type: integer
          example: 1
        lastPage:
          type: boolean
          description: true when there are no more pages; the browser can then filter locally
          example: true
    AeSummary:
      type: object
      description: Core AE fields shared by every screen. Each screen's card and detail extend this.
      required:
        - aeId
        - aeName
        - aeOwners
        - canEdit
      properties:
        aeId:
          type: string
          description: Keeps leading zeros
          example: '000000004561'
        aeName:
          type: string
          example: State Street IM Systematic Equity
        aeDescription:
          type: string
          nullable: true
          example: Performs fund accounting services
        aeOwners:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        businessArea:
          type: string
          nullable: true
          description: Display text
          example: Corporate Divisions - Enterprise Risk Management
        businessDivision:
          type: string
          nullable: true
          description: Display text
          example: Corporate Divisions
        canEdit:
          type: boolean
          description: true if the caller is an owner of this AE (or an admin). false means view only.
          example: true
        modifiedOn:
          type: string
          format: date-time
          example: '2026-10-11T14:21:00Z'
        modifiedBy:
          type: string
          example: map-system
    FilterValues:
      type: object
      description: |
        The AE's value codes for every filter of the screen except aeId and aeName, keyed by filter key.
        Always arrays, also for single-value fields (businessArea, est ...). A missing key means no value.
        aeOwner holds the owners' user ids.
        The browser filters with aeId, aeName and this map only, so every filter of the screen must be here.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        aeOwner:
          - '12345'
        est:
          - EST-01
        businessArea:
          - BA-ERM
        businessDivision:
          - BD-CORP
        auditTeam:
          - AT-ERM
        keyLegalEntity:
          - LE-UK-01
        keyApplication:
          - APP-221
          - APP-310
        keyModel:
          - MDL-17
        keyThirdParty:
          - TP-0091
        costCenter:
          - CC-4410
    AttributeTaggingCard:
      description: One AE card on the Attribute Tagging screen
      allOf:
        - $ref: '#/components/schemas/AeSummary'
        - type: object
          required:
            - recommendationCount
            - filterValues
          properties:
            recommendationCount:
              type: integer
              description: Shown as "N Recommendations"
              example: 4
            filterValues:
              $ref: '#/components/schemas/FilterValues'
    AttributeTaggingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AttributeTaggingCard'
    Filter:
      type: object
      required:
        - key
        - label
        - options
      properties:
        key:
          $ref: '#/components/schemas/FilterKey'
        label:
          type: string
          example: Key Legal Entities
        options:
          type: array
          description: Every value across all AEs (the same for every user). For aeId and aeName, value = AE id; for aeOwner, value = user id.
          items:
            $ref: '#/components/schemas/Option'
    LabelledValues:
      type: object
      description: Same keys as FilterValues, with labels, for detail pages.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/Option'
      example:
        keyLegalEntity:
          - value: LE-UK-01
            label: Example Bank UK Ltd
        keyApplication:
          - value: APP-221
            label: APP-221 Fund Ledger
    AttributeTaggingDetail:
      description: Everything the detail page shows for one AE
      allOf:
        - $ref: '#/components/schemas/AeSummary'
        - type: object
          required:
            - recommendationCount
            - attributes
            - version
          properties:
            recommendationCount:
              type: integer
              example: 4
            attributes:
              $ref: '#/components/schemas/LabelledValues'
            version:
              type: integer
              description: Send back in TagUpdateRequest to detect concurrent edits
              example: 7
    TagUpdateRequest:
      type: object
      description: |
        Replaces the AE's Application, Model and Third Party tags with these lists of codes.
        Choices come from /lookups/keyApplication, /lookups/keyModel and /lookups/keyThirdParty.
      required:
        - keyApplication
        - keyModel
        - keyThirdParty
        - version
      properties:
        keyApplication:
          type: array
          items:
            type: string
          example:
            - APP-221
            - APP-310
        keyModel:
          type: array
          items:
            type: string
          example:
            - MDL-17
        keyThirdParty:
          type: array
          items:
            type: string
          example:
            - TP-0091
        version:
          type: integer
          description: The version read from the detail endpoint. If the AE has changed since, 409 is returned.
          example: 7
    Recommendation:
      type: object
      description: Placeholder shape - align with the recommendations table
      properties:
        id:
          type: integer
          format: int64
          example: 901
        field:
          type: string
          description: Which tag list it is for
          enum:
            - keyApplication
            - keyModel
            - keyThirdParty
        value:
          type: string
          example: APP-512
        label:
          type: string
          example: APP-512 Pricing Engine
        reason:
          type: string
          example: Used by 3 AEs in the same business area
        status:
          type: string
          enum:
            - OPEN
            - ACCEPTED
            - REJECTED
  responses:
    BadRequest:
      description: Invalid request (a filter the screen doesn't offer, pageSize over 1000, bad sort field ...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            title: Bad Request
            detail: Invalid request parameters
            errors:
              - field: pageSize
                message: must be less than or equal to 1000
    Unauthorized:
      description: No user identified (missing or unknown X-User-Id now; missing or expired token later)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            title: Unauthorized
            detail: No user identified. Pick your name again.
    Conflict:
      description: The resource changed since it was read, or a name is already used
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            title: Conflict
            detail: Auditable Entity 000000004561 was changed by someone else. Reload and try again.
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            title: Not Found
            detail: Auditable Entity 000000004561 not found
    Forbidden:
