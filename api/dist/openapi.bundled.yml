openapi: 3.0.3
info:
  title: myAuditPlan API Spec
  version: 5.0.0
  description: |
    Open API specification for myAuditPlan (mAP) - Attribute Tagging.

    ## The screen in one paragraph
    The user lands on Attribute Tagging and sees the Auditable Entities (AEs) they own: the
    AE Owner filter starts preselected with them. They change the dropdown filters to find other
    AEs. Opening an AE shows its 11 attribute types (EST / Business Function, Direct Legal Entity,
    Relevant Legal Entity, Products, Risk Units, Risks, Standards, Assets, Third Parties, Models,
    Location), each with three lists: what is tagged now,
    what is recommended, and what else is available. An owner clicks Edit to lock the AE, adds
    or removes attributes in the browser, and clicks Update to save the whole list. Everyone sees
    the recommendations; after each Update the backend re-runs the recommendation rules.

    ## APIs
    | # | API | Used for |
    |---|---|---|
    | 1 | `GET /attribute-tagging/filters` | Every dropdown and all its values |
    | 2 | `POST /attribute-tagging/aes/search` | The AE list for the selected filters |
    | 3 | `GET /attribute-tagging/aes/{aeId}` | One AE: tagged, recommended and available attributes |
    | 4 | `POST` / `DELETE /attribute-tagging/aes/{aeId}/lock` | Take or release the edit lock |
    | 5 | `PUT /attribute-tagging/aes/{aeId}/attributes` | Update: save the full list of tagged attributes |
    | 6 | `GET` / `POST` / `DELETE /attribute-tagging/saved-filters` | Up to 3 saved filters per user |

    ## Who is the caller
    - For now the UI sends the user's id in the `X-User-Id` header on every call. The user picks
      themselves on a "Who are you?" screen built from the AE Owner options of API 1.
      It is not secure: development and demos only.
    - Later a JWT bearer token replaces the header. No endpoint changes.
    - The user is never a query parameter or a body field.

    ## View and edit
    - Anyone can view any AE.
    - Only an AE owner can edit, and only while holding the AE's **edit lock**. An AE can have
      several owners; the first one to click Edit gets the lock, the others see it view-only
      until it is released.
    - The lock expires after **15 minutes without activity**. Taking the lock again (API 4 POST)
      and Update (API 5) both renew it. While the user is in edit mode the UI renews it every
      5 minutes, as long as the user is active.
    - Update keeps the lock, so the user can save more than once. Done, Cancel or opening another
      AE releases it (API 4 DELETE). With unsaved changes the UI warns first.

    ## Filters
    Values inside one filter are OR'ed; different filters are AND'ed. There is no free-text search:
    typing inside a dropdown only narrows that dropdown's options, in the browser.
  license:
    name: Proprietary
servers:
  - url: https://myAuditPlan/api/v1
security:
  - devUserHeader: []
  - bearerAuth: []
tags:
  - name: AttributeTagging
    description: Attribute Tagging screen
paths:
  /attribute-tagging/filters:
    get:
      tags:
        - AttributeTagging
      summary: 1. All dropdowns and their values
      description: |
        Every filter in screen order, each with every value found across all AEs.
        The same for every user, so the server caches it. Typing in a dropdown narrows its options
        in the browser; there is no search call. The "Who are you?" screen uses the aeOwner options.
      operationId: getFilters
      responses:
        '200':
          description: Filters in screen order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filter'
              example:
                - key: aeOwner
                  label: AE Owner
                  options:
                    - value: '12345'
                      label: John Smith
                - key: aeId
                  label: AE ID
                  options:
                    - value: '000000004561'
                      label: '000000004561'
                - key: legalEntity
                  label: Key Legal Entities
                  options:
                    - value: LE-UK-01
                      label: Example Bank UK Ltd
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/aes/search:
    post:
      tags:
        - AttributeTagging
      summary: 2. AE list for the selected filters
      description: |
        The server applies the filters and returns one page of cards, sorted by AE name.
        The screen opens with filters = { aeOwner: [the user's id] }. {} returns all AEs.
      operationId: searchAes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  $ref: '#/components/schemas/Filters'
            examples:
              screenOpens:
                summary: Screen opens - my AEs
                value:
                  filters:
                    aeOwner:
                      - '12345'
              filtered:
                summary: User picked more filters
                value:
                  filters:
                    aeOwner:
                      - '12345'
                    legalEntity:
                      - LE-UK-01
                      - LE-US-02
                    asset:
                      - APP-221
              allAes:
                summary: No filters - all AEs
                value: {}
      responses:
        '200':
          description: One page of AE cards (empty items if none match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AePage'
              example:
                page: 1
                pageSize: 20
                totalRecords: 37
                totalPages: 2
                items:
                  - aeId: '000000004561'
                    aeName: State Street IM Systematic Equity
                    aeDescription: Performs fund accounting services
                    businessArea: Corporate Divisions - Enterprise Risk Management
                    modifiedOn: '2026-10-11T14:21:00Z'
                    recommendationCount: 4
                    isOwner: true
                    lockedBy:
                      id: '12377'
                      name: Jane Doe
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/aes/{aeId}:
    get:
      tags:
        - AttributeTagging
      summary: 3. One AE with tagged, recommended and available attributes
      description: |
        Anyone can view, including the recommendations. canEdit is true only for the owner who
        holds the lock; everyone else sees the three lists read-only.
      operationId: getAe
      parameters:
        - $ref: '#/components/parameters/AeId'
      responses:
        '200':
          description: The AE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AeDetail'
              example:
                aeId: '000000004561'
                aeName: State Street IM Systematic Equity
                aeDescription: Performs fund accounting services
                businessArea: Corporate Divisions - Enterprise Risk Management
                businessDivision: Corporate Divisions
                aeOwners:
                  - id: '12345'
                    name: John Smith
                  - id: '12377'
                    name: Jane Doe
                isOwner: true
                lock:
                  lockedBy:
                    id: '12377'
                    name: Jane Doe
                  lockedOn: '2026-11-19T12:02:00Z'
                  expiresAt: '2026-11-19T12:17:00Z'
                canEdit: false
                modifiedOn: '2026-10-11T14:21:00Z'
                modifiedBy:
                  id: '12345'
                  name: John Smith
                attributeTypes:
                  - type: asset
                    label: Assets (Applications)
                    tagged:
                      - attributeId: APP-221
                        attributeType: asset
                        name: Fund Ledger
                        description: General ledger for fund accounting
                        comment: Core ledger for this fund
                        status: ACTIVE
                        taggedBy:
                          id: '12345'
                          name: John Smith
                        taggedOn: '2026-10-11T14:21:00Z'
                    recommended:
                      - attributeId: APP-512
                        attributeType: asset
                        name: Pricing Engine
                        description: Prices securities daily
                        reason: Used by 3 AEs in the same business area
                    available:
                      - attributeId: APP-310
                        attributeType: asset
                        name: NAV Calculator
                        description: Calculates daily net asset value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /attribute-tagging/aes/{aeId}/lock:
    parameters:
      - $ref: '#/components/parameters/AeId'
    post:
      tags:
        - AttributeTagging
      summary: 4a. Take or renew the edit lock (Edit button)
      description: |
        - An owner and nobody else holds the lock (or it expired) -> the caller gets it.
        - The caller already holds it -> renewed for another 15 minutes. The UI calls this every
          5 minutes while the user is active in edit mode.
        - Another owner holds it -> 409.
        - Not an owner -> 403.
      operationId: lockAe
      responses:
        '200':
          description: The caller holds the lock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOwner'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Locked'
    delete:
      tags:
        - AttributeTagging
      summary: 4b. Release the edit lock (Done, Cancel, or opening another AE)
      description: |
        Releases the lock if the caller holds it. Does nothing if they don't (it may have expired).
        Unsaved changes are discarded; the UI warns before calling this.
      operationId: unlockAe
      responses:
        '204':
          description: Released, or there was nothing to release
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /attribute-tagging/aes/{aeId}/attributes:
    put:
      tags:
        - AttributeTagging
      summary: 5. Update - save the full list of tagged attributes
      description: |
        Send every attribute that should be tagged after the save, across all 11 types.
        - In the list, not tagged yet -> added, status ACTIVE (comment required).
        - Tagged now, missing from the list -> removed (stored as INACTIVE).
        - In the list and already tagged -> kept; a changed comment is saved.
        The caller must hold the lock (an expired lock that nobody else took is renewed).
        After saving, the recommendation rules run again for this AE, because the new tags can
        change what is recommended. The response therefore has fresh recommended and available lists.
        The lock is kept, so the user can update again.
      operationId: updateAeAttributes
      parameters:
        - $ref: '#/components/parameters/AeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributesUpdateRequest'
            example:
              attributes:
                - attributeId: APP-221
                  attributeType: asset
                  comment: Core ledger for this fund
                - attributeId: APP-512
                  attributeType: asset
                  comment: Added from recommendation - used for pricing
                - attributeId: LE-UK-01
                  attributeType: directLegalEntity
                  comment: UK booking entity
      responses:
        '200':
          description: Saved. Returns the AE as API 3 does, with the new tagged list and the recomputed recommended and available lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOwner'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Locked'
  /attribute-tagging/saved-filters:
    get:
      tags:
        - AttributeTagging
      summary: 6a. The user's saved filters (up to 3)
      operationId: getSavedFilters
      responses:
        '200':
          description: Saved filters, newest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/SavedFilter'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - AttributeTagging
      summary: 6b. Save the current filters
      description: At most 3 per user. A 4th returns 409; the user deletes one first.
      operationId: createSavedFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterRequest'
            example:
              name: UK entities
              filters:
                legalEntity:
                  - LE-UK-01
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The user already has 3 saved filters, or the name is already used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                title: Conflict
                detail: You can save up to 3 filters. Delete one first.
  /attribute-tagging/saved-filters/{id}:
    delete:
      tags:
        - AttributeTagging
      summary: 6c. Delete a saved filter
      operationId: deleteSavedFilter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Temporary, until JWT. The id of the user picked on the "Who are you?" screen. Not secure.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Planned. The token carries the user id.
  schemas:
    FilterKey:
      type: string
      description: |
        The dropdowns on the screen, in screen order. Filters that are also attribute types use the
        same key (est, risk, thirdParty, asset, model, riskUnit, location, product).
        - aeId, aeName, aeOwner, businessArea, businessDivision, costCenter, auditTeam - fields of the AE
        - legalEntity - matches the Direct OR the Relevant Legal Entity
        - the rest - the AE's tagged attributes of that type
      enum:
        - aeOwner
        - aeId
        - aeName
        - est
        - risk
        - legalEntity
        - thirdParty
        - asset
        - businessArea
        - businessDivision
        - model
        - riskUnit
        - costCenter
        - location
        - product
        - auditTeam
    Option:
      type: object
      description: One value in a dropdown
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: Sent back in filters. For aeId and aeName it is the AE id; for aeOwner the user id.
          example: LE-UK-01
        label:
          type: string
          description: Shown in the dropdown and in the chip
          example: Example Bank UK Ltd
    Filter:
      type: object
      required:
        - key
        - label
        - options
      properties:
        key:
          $ref: '#/components/schemas/FilterKey'
        label:
          type: string
          example: Key Legal Entities
        options:
          type: array
          description: Every value across all AEs
          items:
            $ref: '#/components/schemas/Option'
    ErrorResponse:
      type: object
      description: RFC 7807 problem detail (Spring ProblemDetail)
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    Filters:
      type: object
      description: |
        Selected dropdown values, by filter key. Values inside one filter are OR'ed;
        different filters are AND'ed. {} = no filter = all AEs.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        aeOwner:
          - '12345'
        legalEntity:
          - LE-UK-01
          - LE-US-02
    PageMeta:
      type: object
      required:
        - page
        - pageSize
        - totalRecords
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalRecords:
          type: integer
          example: 37
        totalPages:
          type: integer
          example: 2
    Person:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: User id
          example: '12345'
        name:
          type: string
          example: John Smith
    AeCard:
      type: object
      description: One AE card in the list
      required:
        - aeId
        - aeName
        - isOwner
        - recommendationCount
      properties:
        aeId:
          type: string
          example: '000000004561'
        aeName:
          type: string
          example: State Street IM Systematic Equity
        aeDescription:
          type: string
          nullable: true
          example: Performs fund accounting services
        businessArea:
          type: string
          nullable: true
          example: Corporate Divisions - Enterprise Risk Management
        modifiedOn:
          type: string
          format: date-time
          example: '2026-10-11T14:21:00Z'
        recommendationCount:
          type: integer
          description: Shown as "N Recommendations" to everyone (owners and viewers)
          example: 4
        isOwner:
          type: boolean
          description: true = show the Edit option; false = View only
          example: true
        lockedBy:
          type: object
          allOf:
            - $ref: '#/components/schemas/Person'
          nullable: true
          description: Set when another owner is editing this AE right now
    AePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AeCard'
    Lock:
      type: object
      description: Who holds the edit lock, and until when
      required:
        - lockedBy
        - lockedOn
        - expiresAt
      properties:
        lockedBy:
          $ref: '#/components/schemas/Person'
        lockedOn:
          type: string
          format: date-time
          example: '2026-11-19T12:02:00Z'
        expiresAt:
          type: string
          format: date-time
          description: 15 minutes after the last activity (lock taken or renewed, or Update)
          example: '2026-11-19T12:17:00Z'
    AttributeType:
      type: string
      description: |
        The 11 attribute types, in screen order:
        - est - EST / Business Function. The primary recommendation driver: other attributes are
          recommended from EST relationships.
        - directLegalEntity - Direct Legal Entity associated to the AE
        - relevantLegalEntity - related legal entities. Kept separate from Direct Legal Entity.
        - product - Products (client services / products)
        - riskUnit - Risk Units (risk organizations)
        - risk - Risks (potential risks)
        - standard - Standards (Regulations), regulatory obligations
        - asset - Assets (Applications), technology systems
        - thirdParty - Third Parties (external vendors)
        - model - Models (business / risk models)
        - location - Location (work locations)
      enum:
        - est
        - directLegalEntity
        - relevantLegalEntity
        - product
        - riskUnit
        - risk
        - standard
        - asset
        - thirdParty
        - model
        - location
      example: asset
    Attribute:
      type: object
      required:
        - attributeId
        - attributeType
        - name
      properties:
        attributeId:
          type: string
          example: APP-310
        attributeType:
          $ref: '#/components/schemas/AttributeType'
        name:
          type: string
          example: NAV Calculator
        description:
          type: string
          nullable: true
          example: Calculates daily net asset value
    TaggedAttribute:
      description: An attribute tagged to the AE now (status ACTIVE)
      allOf:
        - $ref: '#/components/schemas/Attribute'
        - type: object
          required:
            - status
          properties:
            comment:
              type: string
              nullable: true
              description: Why it was tagged
              example: Core ledger for this fund
            status:
              type: string
              enum:
                - ACTIVE
            taggedBy:
              $ref: '#/components/schemas/Person'
            taggedOn:
              type: string
              format: date-time
              example: '2026-10-11T14:21:00Z'
    RecommendedAttribute:
      description: |
        An attribute the recommendation rules suggest, not tagged yet. The rules are driven mainly by
        the AE's EST / Business Function. Everyone sees recommendations;
        only the owner holding the lock can add one. The rules run again after every Update, because
        a newly tagged attribute can change what is recommended.
      allOf:
        - $ref: '#/components/schemas/Attribute'
        - type: object
          properties:
            reason:
              type: string
              description: Why the rules recommend it
              example: Used by 3 AEs in the same business area
    AttributeTypeGroup:
      type: object
      description: |
        One attribute type with its three lists. Each attribute appears in only one list:
        available = every attribute of this type that is neither tagged nor recommended.
      required:
        - type
        - label
        - tagged
        - recommended
        - available
      properties:
        type:
          $ref: '#/components/schemas/AttributeType'
        label:
          type: string
          example: Assets (Applications)
        tagged:
          type: array
          items:
            $ref: '#/components/schemas/TaggedAttribute'
        recommended:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedAttribute'
        available:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
    AeDetail:
      type: object
      description: One AE with all 11 attribute types
      required:
        - aeId
        - aeName
        - aeOwners
        - isOwner
        - canEdit
        - attributeTypes
      properties:
        aeId:
          type: string
          example: '000000004561'
        aeName:
          type: string
          example: State Street IM Systematic Equity
        aeDescription:
          type: string
          nullable: true
        businessArea:
          type: string
          nullable: true
        businessDivision:
          type: string
          nullable: true
        aeOwners:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        isOwner:
          type: boolean
          description: The caller is one of the AE owners
        lock:
          type: object
          allOf:
            - $ref: '#/components/schemas/Lock'
          nullable: true
          description: null = nobody is editing
        canEdit:
          type: boolean
          description: true only when the caller is an owner AND holds the lock
        modifiedOn:
          type: string
          format: date-time
        modifiedBy:
          $ref: '#/components/schemas/Person'
        attributeTypes:
          type: array
          description: The 11 attribute types, in screen order
          items:
            $ref: '#/components/schemas/AttributeTypeGroup'
    AttributeChange:
      type: object
      required:
        - attributeId
        - attributeType
      properties:
        attributeId:
          type: string
          example: APP-512
        attributeType:
          $ref: '#/components/schemas/AttributeType'
        comment:
          type: string
          maxLength: 1000
          description: Why it is tagged. Required for attributes that are not tagged yet.
          example: Added from recommendation - used for pricing
    AttributesUpdateRequest:
      type: object
      description: |
        The COMPLETE list of attributes that should be tagged after Update, across all 11 types.
        Attributes not in the list are removed (stored as INACTIVE). New ones are stored as ACTIVE.
        Name and description are not sent: the server takes them from the attribute itself.
      required:
        - attributes
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeChange'
    SavedFilterRequest:
      type: object
      required:
        - name
        - filters
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: UK entities
        filters:
          $ref: '#/components/schemas/Filters'
    SavedFilter:
      allOf:
        - $ref: '#/components/schemas/SavedFilterRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 42
            createdOn:
              type: string
              format: date-time
  responses:
    Unauthorized:
      description: No user identified (missing or unknown X-User-Id; later a missing or expired token)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            title: Unauthorized
            detail: No user identified. Pick your name again.
    BadRequest:
      description: Invalid request (unknown filter key, pageSize over 100, missing comment on a new attribute ...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            title: Bad Request
            detail: Invalid request
            errors:
              - field: attributes[1].comment
                message: A comment is required when tagging a new attribute
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            title: Not Found
            detail: Auditable Entity 000000004561 not found
    NotOwner:
      description: The caller is not an owner of this AE, so cannot edit it
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            title: Forbidden
            detail: Only an owner of Auditable Entity 000000004561 can edit it
    Locked:
      description: Another owner holds the edit lock
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            title: Conflict
            detail: Auditable Entity 000000004561 is being edited by Jane Doe
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number (starts at 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Cards per page (max 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
