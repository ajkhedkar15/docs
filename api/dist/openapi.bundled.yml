openapi: 3.0.3
info:
  title: myAuditPlan API Spec
  version: 6.0.0
  description: |
    Open API specification for myAuditPlan (mAP) - Attribute Tagging.

    ## The screen in one paragraph
    The user lands on Attribute Tagging and sees the Auditable Entities (AEs) they own: the
    AE Owner filter starts preselected with them. They change the dropdown filters to find other
    AEs. Opening an AE shows its 11 attribute types (Est, Risks, Key Legal Entities, Key Regulations,
    Key Third Parties, Key Applications, Key Models, Archer Risk Units, General Ledger / Cost Centers,
    Locations, Products), each with what is tagged now and what is recommended; in edit mode also
    All Available. An owner clicks Edit to lock the AE, adds or removes attributes in the browser,
    and clicks Update to save the whole list. Everyone sees the recommendations; after each Update
    the backend re-runs the recommendation rules.

    Some types are hierarchies. Only an attribute without children can be tagged: adding one that
    has children opens the Required Dependency dialog, where the user picks at least one child,
    level by level, until every pick has no children.

    ## APIs
    | # | API | Used for |
    |---|---|---|
    | 1 | `GET /attribute-tagging/filters` | Every dropdown and all its values |
    | 2 | `POST /attribute-tagging/aes/search` | The AE list for the selected filters |
    | 3 | `GET /attribute-tagging/aes/{aeId}` | One AE: tagged and recommended, per attribute type |
    | 4 | `POST` / `DELETE /attribute-tagging/aes/{aeId}/lock` | Take or release the edit lock |
    | 5 | `PUT /attribute-tagging/aes/{aeId}/attributes` | Update: save the full list of tagged attributes |
    | 6 | `GET /attribute-tagging/attribute-types/{type}/attributes` (+ `/{attributeId}/children`) | All Available, and the Required Dependency dialog |
    | 7 | `GET` / `POST` / `DELETE /attribute-tagging/saved-filters` | Up to 3 saved filters per user |

    ## Who is the caller
    - For now the UI sends the user's id in the `X-User-Id` header on every call. The user picks
      themselves on a "Who are you?" screen built from the AE Owner options of API 1.
      It is not secure: development and demos only.
    - Later a JWT bearer token replaces the header. No endpoint changes.
    - The user is never a query parameter or a body field.

    ## View and edit
    - Anyone can view any AE.
    - Only an AE owner can edit, and only while holding the AE's **edit lock**. An AE can have
      several owners; the first one to click Edit gets the lock, the others see it view-only
      until it is released.
    - The lock expires after **15 minutes without activity**. Taking the lock again (API 4 POST)
      and Update (API 5) both renew it. While the user is in edit mode the UI renews it every
      5 minutes, as long as the user is active.
    - Update keeps the lock, so the user can save more than once. Done, Cancel or opening another
      AE releases it (API 4 DELETE). With unsaved changes the UI warns first.

    ## Filters (the same pattern on every screen)
    Every screen has `GET /<screen>/filters` (its dropdowns, as `{ key, label, options: [{ id, name }] }`),
    `POST /<screen>/aes/search` with `{ filters: { <key>: [ids] } }`, and `/<screen>/saved-filters`.
    The shapes live in `common/`; only the list of dropdowns differs per screen.

    Every dropdown is a plain list of values. AE ID, AE Name, AE Owner (preselected), Business Area
    and Division come from the AE table; the other 11 are the attribute types, each from its own
    table, and find the AEs that have the picked values tagged.
    Values inside one filter are OR'ed; different filters are AND'ed. There is no free-text search:
    typing inside a dropdown only narrows that dropdown's options, in the browser.
  license:
    name: Proprietary
servers:
  - url: https://myAuditPlan/api/v1
security:
  - devUserHeader: []
  - bearerAuth: []
tags:
  - name: AttributeTaggingFilters
    description: Filter dropdowns (API 1)
  - name: AttributeTaggingAes
    description: AE list and AE detail (API 2, 3)
  - name: AttributeTaggingLock
    description: Edit lock (API 4)
  - name: AttributeTaggingTags
    description: Update tags, All Available and children (API 5, 6)
  - name: AttributeTaggingSavedFilters
    description: Saved filters (API 7)
paths:
  /attribute-tagging/filters:
    get:
      tags:
        - AttributeTaggingFilters
      summary: 1. All dropdowns and their values
      description: |
        Every filter in screen order, each a plain list of values. 5 come from the AE table; the
        other 11 are the attribute types, each with every taggable value from that type's table
        (2,000+ each). The same for every user, so the server caches it. Typing in a dropdown narrows
        its options in the browser; there is no search call. The "Who are you?" screen uses the aeOwner options.
      operationId: getFilters
      responses:
        '200':
          description: Filters in screen order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filter-2'
              example:
                - key: aeOwner
                  label: AE Owner
                  options:
                    - id: '12345'
                      name: John Smith
                - key: aeId
                  label: AE ID
                  options:
                    - id: '000000004561'
                      name: '000000004561'
                - key: est
                  label: EST
                  options:
                    - id: EST-0042
                      name: Fund Accounting
                - key: legalEntity
                  label: Key Legal Entities
                  options:
                    - id: LE-UK-01
                      name: Example Bank UK Ltd
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/aes/search:
    post:
      tags:
        - AttributeTaggingAes
      summary: 2. AE list for the selected filters
      description: |
        The server applies the filters and returns one page of cards, sorted by AE name.
        The screen opens with filters = { aeOwner: [the user's id] }. {} returns all AEs.
      operationId: searchAes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  $ref: '#/components/schemas/Filters'
            examples:
              screenOpens:
                summary: Screen opens - my AEs
                value:
                  filters:
                    aeOwner:
                      - '12345'
              filtered:
                summary: User picked more filters
                value:
                  filters:
                    aeOwner:
                      - '12345'
                    est:
                      - EST-0042
                    legalEntity:
                      - LE-UK-01
                      - LE-US-02
                    businessDivision:
                      - Corporate Divisions
              allAes:
                summary: No filters - all AEs
                value: {}
      responses:
        '200':
          description: One page of AE cards (empty items if none match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AePage'
              example:
                page: 1
                pageSize: 20
                totalRecords: 37
                totalPages: 2
                items:
                  - aeId: '000000004561'
                    aeName: State Street IM Systematic Equity
                    aeDescription: Performs fund accounting services
                    businessArea: Corporate Divisions - Enterprise Risk Management
                    modifiedOn: '2026-10-11T14:21:00Z'
                    recommendationCount: 49
                    isOwner: true
                    lockedBy:
                      id: '12377'
                      name: Jane Doe
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/aes/{aeId}:
    get:
      tags:
        - AttributeTaggingAes
      summary: 3. One AE with its 11 attribute types - tagged and recommended
      description: |
        Anyone can view, including the recommendations. canEdit is true only for the owner who
        holds the lock; everyone else sees the sections read-only.
        All Available is not included: it is the same for every AE (API 6).
      operationId: getAe
      parameters:
        - $ref: '#/components/parameters/AeId'
      responses:
        '200':
          description: The AE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AeDetail'
              example:
                aeId: '000000004561'
                aeName: State Street IM Systematic Equity
                aeDescription: Performs fund accounting services
                businessArea: Corporate Divisions - Enterprise Risk Management
                businessDivision: Corporate Divisions
                aeOwners:
                  - id: '12345'
                    name: John Smith
                  - id: '12377'
                    name: Jane Doe
                isOwner: true
                lock:
                  lockedBy:
                    id: '12377'
                    name: Jane Doe
                  lockedOn: '2026-11-19T12:02:00Z'
                  expiresAt: '2026-11-19T12:17:00Z'
                canEdit: false
                modifiedOn: '2026-10-11T14:21:00Z'
                modifiedBy:
                  id: '12345'
                  name: John Smith
                recommendationCount: 49
                attributeTypes:
                  - type: legalEntity
                    label: Key Legal Entities
                    description: Legal entities the AE operates through
                    recommendationCount: 47
                    tagged:
                      - attributeId: LE-UK-01
                        attributeType: legalEntity
                        name: Example Bank UK Ltd
                        description: UK booking entity
                        parentId: LE-UK
                        hasChildren: false
                        path:
                          - Example Bank Group
                          - Example Bank UK
                        comment: UK booking entity for this fund
                        status: ACTIVE
                        taggedBy:
                          id: '12345'
                          name: John Smith
                        taggedOn: '2026-10-11T14:21:00Z'
                    recommended:
                      - attributeId: LE-DE
                        attributeType: legalEntity
                        name: Example Bank Germany
                        parentId: null
                        hasChildren: true
                        reason: Used by 3 AEs in the same business area
                  - type: est
                    label: Est
                    recommendationCount: 0
                    tagged: []
                    recommended: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /attribute-tagging/aes/{aeId}/lock:
    parameters:
      - $ref: '#/components/parameters/AeId'
    post:
      tags:
        - AttributeTaggingLock
      summary: 4a. Take or renew the edit lock (Edit button)
      description: |
        - An owner and nobody else holds the lock (or it expired) -> the caller gets it.
        - The caller already holds it -> renewed for another 15 minutes. The UI calls this every
          5 minutes while the user is active in edit mode.
        - Another owner holds it -> 409.
        - Not an owner -> 403.
      operationId: lockAe
      responses:
        '200':
          description: The caller holds the lock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOwner'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Locked'
    delete:
      tags:
        - AttributeTaggingLock
      summary: 4b. Release the edit lock (Done, Cancel, or opening another AE)
      description: |
        Releases the lock if the caller holds it. Does nothing if they don't (it may have expired).
        Unsaved changes are discarded; the UI warns before calling this.
      operationId: unlockAe
      responses:
        '204':
          description: Released, or there was nothing to release
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /attribute-tagging/aes/{aeId}/attributes:
    put:
      tags:
        - AttributeTaggingTags
      summary: 5. Update - save the full list of tagged attributes
      description: |
        Send every attribute that should be tagged after the save, across all 11 types.
        - In the list, not tagged yet -> added, status ACTIVE (comment required).
        - Tagged now, missing from the list -> removed (stored as INACTIVE).
        - In the list and already tagged -> kept; a changed comment is saved.
        The caller must hold the lock (an expired lock that nobody else took is renewed).
        Every item must be an attribute without children (400 otherwise).
        After saving, the recommendation rules run again for this AE, because the new tags can
        change what is recommended. The response therefore has fresh recommended lists and counts.
        The lock is kept, so the user can update again.
      operationId: updateAeAttributes
      parameters:
        - $ref: '#/components/parameters/AeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributesUpdateRequest'
            example:
              attributes:
                - attributeId: LE-UK-01
                  attributeType: legalEntity
                  comment: UK booking entity for this fund
                - attributeId: LE-DE-02
                  attributeType: legalEntity
                  comment: Picked as a child of Example Bank Germany (recommended)
                - attributeId: APP-221
                  attributeType: application
                  comment: Core ledger for this fund
      responses:
        '200':
          description: Saved. Returns the AE as API 3 does, with the new tagged lists and the recomputed recommendations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotOwner'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Locked'
  /attribute-tagging/attribute-types/{type}/attributes:
    get:
      tags:
        - AttributeTaggingTags
      summary: 6a. All Available - the top-level attributes of one type
      description: |
        Every top-level attribute of the type (parentId = null), from that type's own table. For types
        without a hierarchy that is every attribute; expect 2,000+ per type. The same for every AE, so
        the server caches it and the UI loads it once, when a section is opened in edit mode. The UI hides the ones already tagged or recommended;
        its search box filters this list in the browser.
      operationId: getAttributes
      parameters:
        - $ref: '#/components/parameters/AttributeTypePath'
      responses:
        '200':
          description: Top-level attributes, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attribute'
              example:
                - attributeId: LE-DE
                  attributeType: legalEntity
                  name: Example Bank Germany
                  parentId: null
                  hasChildren: true
                - attributeId: LE-SG-01
                  attributeType: legalEntity
                  name: Example Bank Singapore Pte
                  parentId: null
                  hasChildren: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attribute-tagging/attribute-types/{type}/attributes/{attributeId}/children:
    get:
      tags:
        - AttributeTaggingTags
      summary: 6b. Children of one attribute (Required Dependency dialog)
      description: |
        Called when the user adds an attribute that has children. The dialog lists these; the user
        must pick at least one. A picked child that also has children is opened the same way, until
        every pick is an attribute without children. Only those are added to Tagged.
      operationId: getAttributeChildren
      parameters:
        - $ref: '#/components/parameters/AttributeTypePath'
        - name: attributeId
          in: path
          required: true
          schema:
            type: string
            example: LE-DE
      responses:
        '200':
          description: Direct children, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attribute'
              example:
                - attributeId: LE-DE-01
                  attributeType: legalEntity
                  name: Example Bank Germany AG
                  parentId: LE-DE
                  hasChildren: false
                - attributeId: LE-DE-02
                  attributeType: legalEntity
                  name: Example Bank Germany Custody GmbH
                  parentId: LE-DE
                  hasChildren: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /attribute-tagging/saved-filters:
    get:
      tags:
        - AttributeTaggingSavedFilters
      summary: 7a. The user's saved filters (up to 3)
      operationId: getSavedFilters
      responses:
        '200':
          description: Saved filters, newest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/SavedFilter'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - AttributeTaggingSavedFilters
      summary: 7b. Save the current filters
      description: At most 3 per user. A 4th returns 409; the user deletes one first.
      operationId: createSavedFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterRequest'
            example:
              name: ERM division
              filters:
                businessDivision:
                  - Corporate Divisions
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The user already has 3 saved filters, or the name is already used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                title: Conflict
                detail: You can save up to 3 filters. Delete one first.
  /attribute-tagging/saved-filters/{id}:
    delete:
      tags:
        - AttributeTaggingSavedFilters
      summary: 7c. Delete a saved filter
      operationId: deleteSavedFilter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Temporary, until JWT. The id of the user picked on the "Who are you?" screen. Not secure.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Planned. The token carries the user id.
  schemas:
    Option:
      type: object
      description: |
        One value in a dropdown. id is what is sent back in filters; name is what is shown.
        When there is no separate id (AE ID, Business Area, Division) both are the same text.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: AE id for AE ID and AE Name, user id for AE Owner, attribute id for attribute types
          example: LE-UK-01
        name:
          type: string
          description: Shown in the dropdown and in the chip
          example: Example Bank UK Ltd
    Filter:
      type: object
      description: |
        One dropdown. The same shape on every screen; each screen defines its own list of dropdowns
        (keys) in its own folder.
      required:
        - key
        - label
        - options
      properties:
        key:
          type: string
          description: The screen's filter key. Used as the key in Filters.
          example: legalEntity
        label:
          type: string
          example: Key Legal Entities
        options:
          type: array
          description: Every value, as a plain list
          items:
            $ref: '#/components/schemas/Option'
    FilterKey:
      type: string
      description: |
        Attribute Tagging's dropdowns, in screen order. Every dropdown is a plain list (no levels).
        - aeId, aeName, aeOwner, businessArea, businessDivision - from the AE table.
          AE Owner is preselected with the logged-in user.
        - est, risk, legalEntity, regulation, thirdParty, application, model, archerRiskUnit,
          costCenter, location, product - the 11 attribute types, each from its own table.
          Options = every taggable value of that type; picking one finds the AEs that have it tagged.
      enum:
        - aeId
        - aeName
        - aeOwner
        - est
        - risk
        - legalEntity
        - regulation
        - thirdParty
        - application
        - businessArea
        - businessDivision
        - model
        - archerRiskUnit
        - costCenter
        - location
        - product
    Filter-2:
      description: One Attribute Tagging dropdown (the common Filter, with this screen's keys)
      allOf:
        - $ref: '#/components/schemas/Filter'
        - type: object
          properties:
            key:
              $ref: '#/components/schemas/FilterKey'
    ErrorResponse:
      type: object
      description: RFC 7807 problem detail (Spring ProblemDetail)
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    Filters:
      type: object
      description: |
        Selected option ids, by filter key. The same on every screen: values inside one filter are
        OR'ed; different filters are AND'ed. {} = no filter = everything. A key the screen doesn't
        have returns 400.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        aeOwner:
          - '12345'
        legalEntity:
          - LE-UK-01
          - LE-US-02
        businessArea:
          - Corporate Divisions - Enterprise Risk Management
    PageMeta:
      type: object
      required:
        - page
        - pageSize
        - totalRecords
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalRecords:
          type: integer
          example: 37
        totalPages:
          type: integer
          example: 2
    Person:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: User id
          example: '12345'
        name:
          type: string
          example: John Smith
    AeCard:
      type: object
      description: One AE card in the list
      required:
        - aeId
        - aeName
        - isOwner
        - recommendationCount
      properties:
        aeId:
          type: string
          example: '000000004561'
        aeName:
          type: string
          example: State Street IM Systematic Equity
        aeDescription:
          type: string
          nullable: true
          example: Performs fund accounting services
        businessArea:
          type: string
          nullable: true
          example: Corporate Divisions - Enterprise Risk Management
        modifiedOn:
          type: string
          format: date-time
          example: '2026-10-11T14:21:00Z'
        recommendationCount:
          type: integer
          description: Total across all 11 types. Shown as "N Recommendations" to everyone.
          example: 49
        isOwner:
          type: boolean
          description: true = show the Edit option; false = View only
          example: true
        lockedBy:
          type: object
          allOf:
            - $ref: '#/components/schemas/Person'
          nullable: true
          description: Set when an owner is editing this AE right now
    AePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AeCard'
    Lock:
      type: object
      description: Who holds the edit lock, and until when
      required:
        - lockedBy
        - lockedOn
        - expiresAt
      properties:
        lockedBy:
          $ref: '#/components/schemas/Person'
        lockedOn:
          type: string
          format: date-time
          example: '2026-11-19T12:02:00Z'
        expiresAt:
          type: string
          format: date-time
          description: 15 minutes after the last activity (lock taken or renewed, or Update)
          example: '2026-11-19T12:17:00Z'
    AttributeType:
      type: string
      description: |
        The 11 attribute types, in screen order (label on screen in brackets):
        est (Est), risk (Risks), legalEntity (Key Legal Entities), regulation (Key Regulations),
        thirdParty (Key Third Parties), application (Key Applications), model (Key Models),
        archerRiskUnit (Archer Risk Units), costCenter (General Ledger / Cost Centers),
        location (Locations), product (Products).
      enum:
        - est
        - risk
        - legalEntity
        - regulation
        - thirdParty
        - application
        - model
        - archerRiskUnit
        - costCenter
        - location
        - product
      example: legalEntity
    Attribute:
      type: object
      description: |
        One attribute. Each of the 11 types has its own table, with 2,000+ attributes each.
        Some types are hierarchies: an attribute can have children, several levels deep.
        Only an attribute with no children (hasChildren = false) can be tagged. Picking one that has
        children opens the "Required Dependency" dialog, filled from the children endpoint, until the
        user reaches attributes without children. Types that are not hierarchies are all hasChildren = false.
      required:
        - attributeId
        - attributeType
        - name
        - hasChildren
      properties:
        attributeId:
          type: string
          example: LE-UK-01
        attributeType:
          $ref: '#/components/schemas/AttributeType'
        name:
          type: string
          example: Example Bank UK Ltd
        description:
          type: string
          nullable: true
          example: UK booking entity
        parentId:
          type: string
          nullable: true
          description: The parent attribute's id; null at the top level
          example: LE-UK
        hasChildren:
          type: boolean
          description: true = cannot be tagged itself; the user must pick at least one child
          example: false
    TaggedAttribute:
      description: An attribute tagged to the AE now (status ACTIVE). Always one without children.
      allOf:
        - $ref: '#/components/schemas/Attribute'
        - type: object
          required:
            - status
          properties:
            path:
              type: array
              description: Names of its parents, top level first, for display (empty at the top level)
              items:
                type: string
              example:
                - Example Bank Group
                - Example Bank UK
            comment:
              type: string
              nullable: true
              description: Why it was tagged
              example: UK booking entity for this fund
            status:
              type: string
              enum:
                - ACTIVE
            taggedBy:
              $ref: '#/components/schemas/Person'
            taggedOn:
              type: string
              format: date-time
              example: '2026-10-11T14:21:00Z'
    RecommendedAttribute:
      description: |
        An attribute the recommendation rules suggest ("Suggested to Add"), not tagged yet. It can have
        children; then adding it opens the Required Dependency dialog. Everyone sees recommendations;
        only the owner holding the lock can add one. The rules run again after every Update.
      allOf:
        - $ref: '#/components/schemas/Attribute'
        - type: object
          properties:
            reason:
              type: string
              description: Why the rules recommend it
              example: Used by 3 AEs in the same business area
    AttributeTypeGroup:
      type: object
      description: |
        One attribute type section of the AE. "All Available" is not here: it is the same for every AE,
        so the UI loads it from the attributes endpoint when the section is opened in edit mode.
      required:
        - type
        - label
        - recommendationCount
        - tagged
        - recommended
      properties:
        type:
          $ref: '#/components/schemas/AttributeType'
        label:
          type: string
          example: Key Legal Entities
        description:
          type: string
          nullable: true
          description: The explanation shown when the section is opened
          example: Legal entities the AE operates through
        recommendationCount:
          type: integer
          description: Shown as "N Recommendations" on the section
          example: 47
        tagged:
          type: array
          items:
            $ref: '#/components/schemas/TaggedAttribute'
        recommended:
          type: array
          description: Suggested to Add - excludes attributes already tagged
          items:
            $ref: '#/components/schemas/RecommendedAttribute'
    AeDetail:
      type: object
      description: One AE with its 11 attribute type sections
      required:
        - aeId
        - aeName
        - aeOwners
        - isOwner
        - canEdit
        - recommendationCount
        - attributeTypes
      properties:
        aeId:
          type: string
          example: '000000004561'
        aeName:
          type: string
          example: State Street IM Systematic Equity
        aeDescription:
          type: string
          nullable: true
        businessArea:
          type: string
          nullable: true
        businessDivision:
          type: string
          nullable: true
        aeOwners:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        isOwner:
          type: boolean
          description: The caller is one of the AE owners
        lock:
          type: object
          allOf:
            - $ref: '#/components/schemas/Lock'
          nullable: true
          description: null = nobody is editing. Set = show "Currently being modified by <name>".
        canEdit:
          type: boolean
          description: true only when the caller is an owner AND holds the lock
        recommendationCount:
          type: integer
          description: Total across all 11 types
        modifiedOn:
          type: string
          format: date-time
        modifiedBy:
          $ref: '#/components/schemas/Person'
        attributeTypes:
          type: array
          description: The 11 attribute types, in screen order
          items:
            $ref: '#/components/schemas/AttributeTypeGroup'
    AttributeChange:
      type: object
      required:
        - attributeId
        - attributeType
      properties:
        attributeId:
          type: string
          description: Must be an attribute without children
          example: LE-UK-01
        attributeType:
          $ref: '#/components/schemas/AttributeType'
        comment:
          type: string
          maxLength: 1000
          description: Why it is tagged. Required for attributes that are not tagged yet.
          example: UK booking entity for this fund
    AttributesUpdateRequest:
      type: object
      description: |
        The COMPLETE list of attributes that should be tagged after Update, across all 11 types.
        Attributes not in the list are removed (stored as INACTIVE). New ones are stored as ACTIVE.
        Every item must be an attribute without children. Name, description and parent are not sent:
        the server takes them from the attribute itself.
      required:
        - attributes
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeChange'
    SavedFilterRequest:
      type: object
      required:
        - name
        - filters
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: UK entities
        filters:
          $ref: '#/components/schemas/Filters'
    SavedFilter:
      allOf:
        - $ref: '#/components/schemas/SavedFilterRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 42
            createdOn:
              type: string
              format: date-time
  responses:
    Unauthorized:
      description: No user identified (missing or unknown X-User-Id; later a missing or expired token)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            title: Unauthorized
            detail: No user identified. Pick your name again.
    BadRequest:
      description: Invalid request (unknown filter key, pageSize over 100, missing comment on a new attribute ...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            title: Bad Request
            detail: Invalid request
            errors:
              - field: attributes[1].comment
                message: A comment is required when tagging a new attribute
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            title: Not Found
            detail: Auditable Entity 000000004561 not found
    NotOwner:
      description: The caller is not an owner of this AE, so cannot edit it
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            title: Forbidden
            detail: Only an owner of Auditable Entity 000000004561 can edit it
    Locked:
      description: Another owner holds the edit lock
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            title: Conflict
            detail: Auditable Entity 000000004561 is being edited by Jane Doe
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number (starts at 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Cards per page (max 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    AeId:
      name: aeId
      in: path
      required: true
      description: AE id (string; keeps leading zeros)
      schema:
        type: string
        example: '000000004561'
    AttributeTypePath:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AttributeType'
