Person:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      description: User id
      example: '12345'
    name:
      type: string
      example: John Smith

Filter:
  type: object
  description: |
    One dropdown: its type and a plain list of values. The same shape on every screen; each
    screen defines its own list of types in its own folder.
  required: [type, options]
  properties:
    type:
      type: string
      description: The screen's filter type. Used as the key in Filters.
      example: legalEntity
    options:
      type: array
      description: Every value, as a plain list of text, sorted, no duplicates
      items:
        type: string
      example: [Example Bank Germany AG, Example Bank UK Ltd, Example Bank US Inc]

Filters:
  type: object
  description: |
    Selected values, by filter type: the same text as in options. The same on every screen:
    values inside one filter are OR'ed; different filters are AND'ed. {} = no filter = everything.
    A type the screen doesn't have returns 400.
  additionalProperties:
    type: array
    items:
      type: string
  example:
    aeOwner: [John Smith]
    legalEntity: [Example Bank UK Ltd, Example Bank US Inc]
    businessArea: [Corporate Divisions - Enterprise Risk Management]

PageMeta:
  type: object
  required: [page, pageSize, totalRecords, totalPages]
  properties:
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 20
    totalRecords:
      type: integer
      example: 37
    totalPages:
      type: integer
      example: 2

ErrorResponse:
  type: object
  description: RFC 7807 problem detail (Spring ProblemDetail)
  properties:
    status:
      type: integer
    title:
      type: string
    detail:
      type: string
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string
