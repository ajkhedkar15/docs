Person:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      description: User id
      example: '12345'
    name:
      type: string
      example: John Smith

Option:
  type: object
  description: One value in a dropdown
  required: [value, label]
  properties:
    value:
      type: string
      description: Sent back in filters. For aeId and aeName it is the AE id; for aeOwner the user id.
      example: LE-UK-01
    label:
      type: string
      description: Shown in the dropdown and in the chip
      example: Example Bank UK Ltd

FilterKey:
  type: string
  description: |
    The dropdowns on the screen, in screen order. Filters that are also attribute types use the
    same key (est, risk, thirdParty, asset, model, riskUnit, location, product).
    - aeId, aeName, aeOwner, businessArea, businessDivision, costCenter, auditTeam - fields of the AE
    - legalEntity - matches the Direct OR the Relevant Legal Entity
    - the rest - the AE's tagged attributes of that type
  enum:
    - aeOwner
    - aeId
    - aeName
    - est
    - risk
    - legalEntity
    - thirdParty
    - asset
    - businessArea
    - businessDivision
    - model
    - riskUnit
    - costCenter
    - location
    - product
    - auditTeam

Filter:
  type: object
  required: [key, label, options]
  properties:
    key:
      $ref: '#/FilterKey'
    label:
      type: string
      example: Key Legal Entities
    options:
      type: array
      description: Every value across all AEs
      items:
        $ref: '#/Option'

Filters:
  type: object
  description: |
    Selected dropdown values, by filter key. Values inside one filter are OR'ed;
    different filters are AND'ed. {} = no filter = all AEs.
  additionalProperties:
    type: array
    items:
      type: string
  example:
    aeOwner: ['12345']
    legalEntity: [LE-UK-01, LE-US-02]

PageMeta:
  type: object
  required: [page, pageSize, totalRecords, totalPages]
  properties:
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 20
    totalRecords:
      type: integer
      example: 37
    totalPages:
      type: integer
      example: 2

ErrorResponse:
  type: object
  description: RFC 7807 problem detail (Spring ProblemDetail)
  properties:
    status:
      type: integer
    title:
      type: string
    detail:
      type: string
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string
