Person:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      description: User id
      example: '12345'
    name:
      type: string
      example: John Smith

Option:
  type: object
  description: |
    One value in a dropdown. id is what is sent back in filters; name is what is shown.
    When there is no separate id (AE ID, Business Area, Division) both are the same text.
  required: [id, name]
  properties:
    id:
      type: string
      description: AE id for AE ID and AE Name, user id for AE Owner, attribute id for attribute types
      example: LE-UK-01
    name:
      type: string
      description: Shown in the dropdown and in the chip
      example: Example Bank UK Ltd

Filter:
  type: object
  description: |
    One dropdown. The same shape on every screen; each screen defines its own list of dropdowns
    (keys) in its own folder.
  required: [key, label, options]
  properties:
    key:
      type: string
      description: The screen's filter key. Used as the key in Filters.
      example: legalEntity
    label:
      type: string
      example: Key Legal Entities
    options:
      type: array
      description: Every value, as a plain list
      items:
        $ref: '#/Option'

Filters:
  type: object
  description: |
    Selected option ids, by filter key. The same on every screen: values inside one filter are
    OR'ed; different filters are AND'ed. {} = no filter = everything. A key the screen doesn't
    have returns 400.
  additionalProperties:
    type: array
    items:
      type: string
  example:
    aeOwner: ['12345']
    legalEntity: [LE-UK-01, LE-US-02]
    businessArea: [Corporate Divisions - Enterprise Risk Management]

PageMeta:
  type: object
  required: [page, pageSize, totalRecords, totalPages]
  properties:
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 20
    totalRecords:
      type: integer
      example: 37
    totalPages:
      type: integer
      example: 2

ErrorResponse:
  type: object
  description: RFC 7807 problem detail (Spring ProblemDetail)
  properties:
    status:
      type: integer
    title:
      type: string
    detail:
      type: string
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string
