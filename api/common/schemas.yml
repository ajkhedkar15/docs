ScreenId:
  type: string
  description: Screen identifier. Add new screens here.
  enum:
    - attribute-tagging

Scope:
  type: string
  enum: [MINE, ALL]
  default: MINE

Person:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      description: Stable user id (used for ownership checks)
      example: '12345'
    name:
      type: string
      example: John Smith

CurrentUser:
  type: object
  required: [id, name, roles]
  properties:
    id:
      type: string
      example: '12345'
    name:
      type: string
      example: John Smith
    username:
      type: string
      example: jsmith
    roles:
      type: array
      items:
        type: string
      example: [AE_USER]

AeSummary:
  type: object
  description: Core AE fields shared by every screen. Screen cards extend this.
  required: [aeId, aeName, aeOwner, canEdit]
  properties:
    aeId:
      type: string
      example: '000000004561'
    aeName:
      type: string
      example: State Street IM Systematic Equity
    aeDescription:
      type: string
      nullable: true
      example: Performs fund accounting services
    aeOwner:
      type: array
      items:
        $ref: '#/Person'
    businessArea:
      type: string
      nullable: true
      example: Corporate Divisions - Enterprise Risk Management
    division:
      type: string
      nullable: true
      example: Corporate Divisions
    canEdit:
      type: boolean
      description: true if the caller is an owner of this AE (or an admin). false means view only.
      example: true
    modifiedOn:
      type: string
      format: date-time
      example: '2026-10-11T14:21:00Z'
    modifiedBy:
      type: string
      example: map-system

PageMeta:
  type: object
  required: [page, pageSize, totalRecords, totalPages, lastPage]
  properties:
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 1000
    totalRecords:
      type: integer
      example: 156
    totalPages:
      type: integer
      example: 1
    lastPage:
      type: boolean
      description: true when there are no more pages; the client can then filter locally
      example: true

FilterKey:
  type: string
  description: |
    Catalog of every filter used across screens. Each screen accepts only its own subset
    (an unknown field for that screen returns 400).
  enum:
    - aeId
    - aeName
    - est
    - risk
    - keyLegalEntity
    - keyThirdParty
    - keyApplication
    - businessArea
    - businessDivision
    - keyModel
    - archerRiskUnit
    - costCenter
    - location
    - product
    - auditTeam

Criterion:
  type: object
  required: [field, values]
  properties:
    field:
      $ref: '#/FilterKey'
    operator:
      type: string
      enum: [INCLUDE, EXCLUDE]
      default: INCLUDE
    values:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: string

SearchRequest:
  type: object
  properties:
    scope:
      $ref: '#/Scope'
    searchText:
      type: string
      maxLength: 100
      description: Case-insensitive contains match on aeId, aeName and aeDescription
    criteria:
      type: array
      maxItems: 15
      items:
        $ref: '#/Criterion'

FilterOption:
  type: object
  required: [value, label]
  properties:
    value:
      type: string
      description: Sent back in criteria (a code or id)
      example: LE-UK-01
    label:
      type: string
      description: Shown in dropdowns and chips
      example: Example Bank UK Ltd
    count:
      type: integer
      description: Number of AEs in the requested scope with this value
      example: 12

Filter:
  type: object
  required: [key, label, type, options]
  properties:
    key:
      $ref: '#/FilterKey'
    label:
      type: string
      example: Key Legal Entities
    type:
      type: string
      description: TYPEAHEAD filters have no options; use the screen's /filters/{key}/options endpoint
      enum: [MULTI_SELECT, TYPEAHEAD]
    options:
      type: array
      items:
        $ref: '#/FilterOption'

LookupType:
  type: string
  description: Reference data lists (all values, not only those already used on AEs)
  enum:
    - application
    - model
    - thirdParty
    - legalEntity
    - costCenter
    - location
    - product

SavedFilterRequest:
  type: object
  required: [screen, name, criteria]
  properties:
    screen:
      $ref: '#/ScreenId'
    name:
      type: string
      minLength: 1
      maxLength: 100
      example: UK legal entities
    scope:
      $ref: '#/Scope'
    searchText:
      type: string
      maxLength: 100
    criteria:
      type: array
      items:
        $ref: '#/Criterion'

SavedFilter:
  allOf:
    - $ref: '#/SavedFilterRequest'
    - type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        createdOn:
          type: string
          format: date-time

ErrorResponse:
  type: object
  description: RFC 7807 problem detail (Spring ProblemDetail)
  properties:
    status:
      type: integer
    title:
      type: string
    detail:
      type: string
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string
