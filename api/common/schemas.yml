Person:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      description: User id
      example: '12345'
    name:
      type: string
      example: John Smith

Option:
  type: object
  description: |
    One value in a dropdown. id is what is sent back in filters; name is what is shown.
    When there is no separate id (AE ID, Business Area, Division) both are the same text.
  required: [id, name]
  properties:
    id:
      type: string
      description: AE id for AE ID and AE Name, user id for AE Owner, attribute id for attribute types
      example: LE-UK-01
    name:
      type: string
      description: Shown in the dropdown and in the chip
      example: Example Bank UK Ltd

FilterKey:
  type: string
  description: |
    The dropdowns on the screen, in screen order. Every dropdown is a plain list (no levels).
    - aeId, aeName, aeOwner, businessArea, businessDivision - from the AE table.
      AE Owner is preselected with the logged-in user.
    - est, risk, legalEntity, regulation, thirdParty, application, model, archerRiskUnit,
      costCenter, location, product - the 11 attribute types, each from its own table.
      Options = every taggable value of that type; picking one finds the AEs that have it tagged.
  enum:
    - aeId
    - aeName
    - aeOwner
    - est
    - risk
    - legalEntity
    - regulation
    - thirdParty
    - application
    - businessArea
    - businessDivision
    - model
    - archerRiskUnit
    - costCenter
    - location
    - product

Filter:
  type: object
  required: [key, label, options]
  properties:
    key:
      $ref: '#/FilterKey'
    label:
      type: string
      example: Key Legal Entities
    options:
      type: array
      description: Every value across all AEs, as a plain list
      items:
        $ref: '#/Option'

Filters:
  type: object
  description: |
    Selected option ids, by filter key. Values inside one filter are OR'ed;
    different filters are AND'ed. {} = no filter = all AEs.
  additionalProperties:
    type: array
    items:
      type: string
  example:
    aeOwner: ['12345']
    legalEntity: [LE-UK-01, LE-US-02]
    businessArea: [Corporate Divisions - Enterprise Risk Management]

PageMeta:
  type: object
  required: [page, pageSize, totalRecords, totalPages]
  properties:
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 20
    totalRecords:
      type: integer
      example: 37
    totalPages:
      type: integer
      example: 2

ErrorResponse:
  type: object
  description: RFC 7807 problem detail (Spring ProblemDetail)
  properties:
    status:
      type: integer
    title:
      type: string
    detail:
      type: string
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string
