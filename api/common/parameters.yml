AeId:
  name: aeId
  in: path
  required: true
  description: AE id (string; keeps leading zeros)
  schema:
    type: string
    example: '000000004561'

Scope:
  name: scope
  in: query
  required: false
  description: MINE = AEs where the caller is an owner (default); ALL = every AE
  schema:
    $ref: './schemas.yml#/Scope'

Page:
  name: page
  in: query
  required: false
  description: Page number (starts at 1)
  schema:
    type: integer
    default: 1
    minimum: 1

PageSize:
  name: pageSize
  in: query
  required: false
  description: Records per page (max 1000)
  schema:
    type: integer
    default: 1000
    minimum: 1
    maximum: 1000

Sort:
  name: sort
  in: query
  required: false
  description: 'field,asc|desc. Allowed fields are listed per screen. aeId is always added as a tiebreaker.'
  schema:
    type: string
    default: aeName,asc

Limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
