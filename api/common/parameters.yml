AeId:
  name: aeId
  in: path
  required: true
  description: AE id (string; keeps leading zeros)
  schema:
    type: string
    example: '000000004561'

Page:
  name: page
  in: query
  required: false
  description: Page number (starts at 1)
  schema:
    type: integer
    default: 1
    minimum: 1

PageSize:
  name: pageSize
  in: query
  required: false
  description: Cards per page (max 100)
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
