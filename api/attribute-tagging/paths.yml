aes:
  get:
    tags: [AttributeTagging]
    summary: Attribute Tagging cards (mine by default, or all)
    description: Sort fields allowed - aeName, aeId, businessArea, modifiedOn.
    operationId: getAttributeTaggingAes
    parameters:
      - $ref: '../common/parameters.yml#/Scope'
      - $ref: '../common/parameters.yml#/Page'
      - $ref: '../common/parameters.yml#/PageSize'
      - $ref: '../common/parameters.yml#/Sort'
    responses:
      '200':
        description: A page of AEs (empty list if none)
        content:
          application/json:
            schema:
              $ref: './schemas.yml#/AttributeTaggingPage'
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '500':
        $ref: '../common/responses.yml#/ServerError'

aesSearch:
  post:
    tags: [AttributeTagging]
    summary: Search and filter Attribute Tagging cards
    description: |
      Filters allowed on this screen - aeId, aeName, est, risk, keyLegalEntity, keyThirdParty,
      keyApplication, businessArea, businessDivision, keyModel, archerRiskUnit, costCenter,
      location, product, auditTeam.
    operationId: searchAttributeTaggingAes
    parameters:
      - $ref: '../common/parameters.yml#/Page'
      - $ref: '../common/parameters.yml#/PageSize'
      - $ref: '../common/parameters.yml#/Sort'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../common/schemas.yml#/SearchRequest'
          example:
            scope: ALL
            searchText: equity
            criteria:
              - field: aeName
                operator: INCLUDE
                values: ['000000004561', '000000004890']
              - field: keyLegalEntity
                operator: INCLUDE
                values: [LE-UK-01]
              - field: costCenter
                operator: EXCLUDE
                values: [CC-9999]
    responses:
      '200':
        description: Matching AEs (empty list if none match)
        content:
          application/json:
            schema:
              $ref: './schemas.yml#/AttributeTaggingPage'
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '500':
        $ref: '../common/responses.yml#/ServerError'

filters:
  get:
    tags: [AttributeTagging]
    summary: Filter dropdowns for Attribute Tagging
    description: Options are distinct values from the AEs in the requested scope, in screen order.
    operationId: getAttributeTaggingFilters
    parameters:
      - $ref: '../common/parameters.yml#/Scope'
    responses:
      '200':
        description: Filters in screen order
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../common/schemas.yml#/Filter'
            example:
              - key: aeName
                label: AE Name
                type: MULTI_SELECT
                options:
                  - value: '000000004561'
                    label: State Street IM Systematic Equity
                    count: 1
              - key: keyLegalEntity
                label: Key Legal Entities
                type: MULTI_SELECT
                options:
                  - value: LE-UK-01
                    label: Example Bank UK Ltd
                    count: 12
              - key: keyThirdParty
                label: Key Third Parties
                type: TYPEAHEAD
                options: []
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '500':
        $ref: '../common/responses.yml#/ServerError'

filterOptions:
  get:
    tags: [AttributeTagging]
    summary: Typeahead options for one filter
    description: Only for filters returned as TYPEAHEAD by /attribute-tagging/filters.
    operationId: getAttributeTaggingFilterOptions
    parameters:
      - $ref: '../common/parameters.yml#/FilterKeyPath'
      - $ref: '../common/parameters.yml#/TypeaheadQuery'
      - $ref: '../common/parameters.yml#/Scope'
      - $ref: '../common/parameters.yml#/Limit'
    responses:
      '200':
        description: Matching options
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../common/schemas.yml#/FilterOption'
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'

aeDetail:
  get:
    tags: [AttributeTagging]
    summary: Attribute Tagging detail of one AE
    description: Any user can view. canEdit decides whether the edit form is shown.
    operationId: getAttributeTaggingAe
    parameters:
      - $ref: '../common/parameters.yml#/AeId'
    responses:
      '200':
        description: The AE with its tags
        content:
          application/json:
            schema:
              $ref: './schemas.yml#/AttributeTaggingDetail'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '404':
        $ref: '../common/responses.yml#/NotFound'
      '500':
        $ref: '../common/responses.yml#/ServerError'

aeTags:
  put:
    tags: [AttributeTagging]
    summary: Assign Application, Model and Third Party tags (owners only)
    description: Replaces the three tag lists. The server checks that the caller is an owner.
    operationId: updateAttributeTaggingTags
    parameters:
      - $ref: '../common/parameters.yml#/AeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yml#/TagUpdateRequest'
    responses:
      '200':
        description: Updated AE detail
        content:
          application/json:
            schema:
              $ref: './schemas.yml#/AttributeTaggingDetail'
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '403':
        $ref: '../common/responses.yml#/Forbidden'
      '404':
        $ref: '../common/responses.yml#/NotFound'
      '409':
        $ref: '../common/responses.yml#/Conflict'
      '500':
        $ref: '../common/responses.yml#/ServerError'

aeRecommendations:
  get:
    tags: [AttributeTagging]
    summary: Recommendations for one AE
    operationId: getAttributeTaggingRecommendations
    parameters:
      - $ref: '../common/parameters.yml#/AeId'
    responses:
      '200':
        description: Recommendations
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yml#/Recommendation'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '404':
        $ref: '../common/responses.yml#/NotFound'
