AttributeTaggingCard:
  description: One AE card on the Attribute Tagging screen
  allOf:
    - $ref: '../common/schemas.yml#/AeSummary'
    - type: object
      required: [recommendationCount, filterValues]
      properties:
        recommendationCount:
          type: integer
          description: Shown as "N Recommendations"
          example: 4
        filterValues:
          $ref: '../common/schemas.yml#/FilterValues'

AttributeTaggingPage:
  allOf:
    - $ref: '../common/schemas.yml#/PageMeta'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/AttributeTaggingCard'

AttributeTaggingDetail:
  description: Everything the detail page shows for one AE
  allOf:
    - $ref: '../common/schemas.yml#/AeSummary'
    - type: object
      required: [recommendationCount, attributes, version]
      properties:
        recommendationCount:
          type: integer
          example: 4
        attributes:
          $ref: '../common/schemas.yml#/LabelledValues'
        version:
          type: integer
          description: Send back in TagUpdateRequest to detect concurrent edits
          example: 7

TagUpdateRequest:
  type: object
  description: |
    Replaces the AE's Application, Model and Third Party tags with these lists of codes.
    Choices come from /lookups/keyApplication, /lookups/keyModel and /lookups/keyThirdParty.
  required: [keyApplication, keyModel, keyThirdParty, version]
  properties:
    keyApplication:
      type: array
      items:
        type: string
      example: [APP-221, APP-310]
    keyModel:
      type: array
      items:
        type: string
      example: [MDL-17]
    keyThirdParty:
      type: array
      items:
        type: string
      example: [TP-0091]
    version:
      type: integer
      description: The version read from the detail endpoint. If the AE has changed since, 409 is returned.
      example: 7

Recommendation:
  type: object
  description: Placeholder shape - align with the recommendations table
  properties:
    id:
      type: integer
      format: int64
      example: 901
    field:
      type: string
      description: Which tag list it is for
      enum: [keyApplication, keyModel, keyThirdParty]
    value:
      type: string
      example: APP-512
    label:
      type: string
      example: APP-512 Pricing Engine
    reason:
      type: string
      example: Used by 3 AEs in the same business area
    status:
      type: string
      enum: [OPEN, ACCEPTED, REJECTED]
