Lock:
  type: object
  description: Who holds the edit lock, and until when
  required: [lockedBy, lockedOn, expiresAt]
  properties:
    lockedBy:
      $ref: '../common/schemas.yml#/Person'
    lockedOn:
      type: string
      format: date-time
      example: '2026-11-19T12:02:00Z'
    expiresAt:
      type: string
      format: date-time
      description: 15 minutes after the last activity (lock taken or renewed, or Update)
      example: '2026-11-19T12:17:00Z'

AeCard:
  type: object
  description: One AE card in the list
  required: [aeId, aeName, isOwner, recommendationCount]
  properties:
    aeId:
      type: string
      example: '000000004561'
    aeName:
      type: string
      example: State Street IM Systematic Equity
    aeDescription:
      type: string
      nullable: true
      example: Performs fund accounting services
    businessArea:
      type: string
      nullable: true
      example: Corporate Divisions - Enterprise Risk Management
    modifiedOn:
      type: string
      format: date-time
      example: '2026-10-11T14:21:00Z'
    recommendationCount:
      type: integer
      description: Shown as "N Recommendations" to everyone (owners and viewers)
      example: 4
    isOwner:
      type: boolean
      description: true = show the Edit option; false = View only
      example: true
    lockedBy:
      type: object
      allOf:
        - $ref: '../common/schemas.yml#/Person'
      nullable: true
      description: Set when another owner is editing this AE right now

AePage:
  allOf:
    - $ref: '../common/schemas.yml#/PageMeta'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/AeCard'

AttributeType:
  type: string
  description: |
    The 11 attribute types, in screen order:
    - est - EST / Business Function. The primary recommendation driver: other attributes are
      recommended from EST relationships.
    - directLegalEntity - Direct Legal Entity associated to the AE
    - relevantLegalEntity - related legal entities. Kept separate from Direct Legal Entity.
    - product - Products (client services / products)
    - riskUnit - Risk Units (risk organizations)
    - risk - Risks (potential risks)
    - standard - Standards (Regulations), regulatory obligations
    - asset - Assets (Applications), technology systems
    - thirdParty - Third Parties (external vendors)
    - model - Models (business / risk models)
    - location - Location (work locations)
  enum:
    - est
    - directLegalEntity
    - relevantLegalEntity
    - product
    - riskUnit
    - risk
    - standard
    - asset
    - thirdParty
    - model
    - location
  example: asset

Attribute:
  type: object
  required: [attributeId, attributeType, name]
  properties:
    attributeId:
      type: string
      example: APP-310
    attributeType:
      $ref: '#/AttributeType'
    name:
      type: string
      example: NAV Calculator
    description:
      type: string
      nullable: true
      example: Calculates daily net asset value

TaggedAttribute:
  description: An attribute tagged to the AE now (status ACTIVE)
  allOf:
    - $ref: '#/Attribute'
    - type: object
      required: [status]
      properties:
        comment:
          type: string
          nullable: true
          description: Why it was tagged
          example: Core ledger for this fund
        status:
          type: string
          enum: [ACTIVE]
        taggedBy:
          $ref: '../common/schemas.yml#/Person'
        taggedOn:
          type: string
          format: date-time
          example: '2026-10-11T14:21:00Z'

RecommendedAttribute:
  description: |
    An attribute the recommendation rules suggest, not tagged yet. The rules are driven mainly by
    the AE's EST / Business Function. Everyone sees recommendations;
    only the owner holding the lock can add one. The rules run again after every Update, because
    a newly tagged attribute can change what is recommended.
  allOf:
    - $ref: '#/Attribute'
    - type: object
      properties:
        reason:
          type: string
          description: Why the rules recommend it
          example: Used by 3 AEs in the same business area

AttributeTypeGroup:
  type: object
  description: |
    One attribute type with its three lists. Each attribute appears in only one list:
    available = every attribute of this type that is neither tagged nor recommended.
  required: [type, label, tagged, recommended, available]
  properties:
    type:
      $ref: '#/AttributeType'
    label:
      type: string
      example: Assets (Applications)
    tagged:
      type: array
      items:
        $ref: '#/TaggedAttribute'
    recommended:
      type: array
      items:
        $ref: '#/RecommendedAttribute'
    available:
      type: array
      items:
        $ref: '#/Attribute'

AeDetail:
  type: object
  description: One AE with all 11 attribute types
  required: [aeId, aeName, aeOwners, isOwner, canEdit, attributeTypes]
  properties:
    aeId:
      type: string
      example: '000000004561'
    aeName:
      type: string
      example: State Street IM Systematic Equity
    aeDescription:
      type: string
      nullable: true
    businessArea:
      type: string
      nullable: true
    businessDivision:
      type: string
      nullable: true
    aeOwners:
      type: array
      items:
        $ref: '../common/schemas.yml#/Person'
    isOwner:
      type: boolean
      description: The caller is one of the AE owners
    lock:
      type: object
      allOf:
        - $ref: '#/Lock'
      nullable: true
      description: null = nobody is editing
    canEdit:
      type: boolean
      description: true only when the caller is an owner AND holds the lock
    modifiedOn:
      type: string
      format: date-time
    modifiedBy:
      $ref: '../common/schemas.yml#/Person'
    attributeTypes:
      type: array
      description: The 11 attribute types, in screen order
      items:
        $ref: '#/AttributeTypeGroup'

AttributeChange:
  type: object
  required: [attributeId, attributeType]
  properties:
    attributeId:
      type: string
      example: APP-512
    attributeType:
      $ref: '#/AttributeType'
    comment:
      type: string
      maxLength: 1000
      description: Why it is tagged. Required for attributes that are not tagged yet.
      example: Added from recommendation - used for pricing

AttributesUpdateRequest:
  type: object
  description: |
    The COMPLETE list of attributes that should be tagged after Update, across all 11 types.
    Attributes not in the list are removed (stored as INACTIVE). New ones are stored as ACTIVE.
    Name and description are not sent: the server takes them from the attribute itself.
  required: [attributes]
  properties:
    attributes:
      type: array
      items:
        $ref: '#/AttributeChange'

SavedFilterRequest:
  type: object
  required: [name, filters]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
      example: UK entities
    filters:
      $ref: '../common/schemas.yml#/Filters'

SavedFilter:
  allOf:
    - $ref: '#/SavedFilterRequest'
    - type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        createdOn:
          type: string
          format: date-time
