users:
  get:
    tags: [Shared]
    summary: Find users (for the temporary "Who are you?" screen)
    description: |
      Contains-search on user name. Called without X-User-Id, because the user has not picked
      themselves yet. Will be removed or restricted once JWT login is in place.
    operationId: searchUsers
    security: []
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - $ref: '../common/parameters.yml#/Limit'
    responses:
      '200':
        description: Matching users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../common/schemas.yml#/Person'
            example:
              - id: '12345'
                name: John Smith
              - id: '12377'
                name: Johanna Smithers
      '400':
        $ref: '../common/responses.yml#/BadRequest'

me:
  get:
    tags: [Shared]
    summary: Current user
    description: |
      Who the caller is: from X-User-Id for now, from the bearer token later.
      The UI calls this after the "Who are you?" screen to confirm the id is valid.
    operationId: getCurrentUser
    responses:
      '200':
        description: The current user
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yml#/CurrentUser'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'

aeById:
  get:
    tags: [Shared]
    summary: Core info of one Auditable Entity
    description: Any user can view any AE. Screens use their own detail endpoint for screen-specific data.
    operationId: getAuditableEntity
    parameters:
      - $ref: '../common/parameters.yml#/AeId'
    responses:
      '200':
        description: The AE
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yml#/AeSummary'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '404':
        $ref: '../common/responses.yml#/NotFound'

savedFilters:
  get:
    tags: [Shared]
    summary: The caller's saved filters for one screen
    operationId: getSavedFilters
    parameters:
      - name: screen
        in: query
        required: true
        schema:
          $ref: '../common/schemas.yml#/ScreenId'
    responses:
      '200':
        description: Saved filters
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../common/schemas.yml#/SavedFilter'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
  post:
    tags: [Shared]
    summary: Save the current filters
    operationId: createSavedFilter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../common/schemas.yml#/SavedFilterRequest'
          example:
            screen: attribute-tagging
            name: UK legal entities
            scope: ALL
            criteria:
              - field: keyLegalEntity
                operator: INCLUDE
                values: [LE-UK-01]
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yml#/SavedFilter'
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '409':
        $ref: '../common/responses.yml#/Conflict'

savedFilterById:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  put:
    tags: [Shared]
    summary: Update one of the caller's saved filters
    operationId: updateSavedFilter
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../common/schemas.yml#/SavedFilterRequest'
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema:
              $ref: '../common/schemas.yml#/SavedFilter'
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '404':
        $ref: '../common/responses.yml#/NotFound'
  delete:
    tags: [Shared]
    summary: Delete one of the caller's saved filters
    operationId: deleteSavedFilter
    responses:
      '204':
        description: Deleted
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
      '404':
        $ref: '../common/responses.yml#/NotFound'

lookups:
  get:
    tags: [Shared]
    summary: Reference data for edit forms
    description: |
      All possible values of a list (for example every application), not only those already
      used on AEs. Used when assigning tags. Filter dropdowns use the screen's /filters instead.
    operationId: getLookup
    parameters:
      - name: type
        in: path
        required: true
        schema:
          $ref: '../common/schemas.yml#/LookupType'
      - name: q
        in: query
        required: false
        description: Optional contains-search on value or label
        schema:
          type: string
          maxLength: 100
      - $ref: '../common/parameters.yml#/Limit'
    responses:
      '200':
        description: Matching values
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../common/schemas.yml#/FilterOption'
            example:
              - value: APP-221
                label: APP-221 Fund Ledger
              - value: APP-310
                label: APP-310 NAV Calculator
      '400':
        $ref: '../common/responses.yml#/BadRequest'
      '401':
        $ref: '../common/responses.yml#/Unauthorized'
