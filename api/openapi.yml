openapi: 3.0.3
info:
  title: myAuditPlan API Spec
  version: 3.0.0
  description: |
    Open API specification for myAuditPlan (mAP).

    ## Structure
    - **Shared** endpoints are at the root: current user, core AE info, saved filters, lookups.
    - **Each screen** has its own prefix (`/attribute-tagging`, later `/risk-assessment`, `/audit-plan` ...)
      and the same endpoints: `POST /aes/search` (list and filter), `GET /filters`,
      `GET /aes/{aeId}` (detail), and edit endpoints under `/aes/{aeId}/...`.

    ## Who is the caller
    - **Now (temporary):** the UI shows a "Who are you?" screen. The user picks themselves from
      `GET /users?q=`, and the UI sends that user's id in the `X-User-Id` header on every call.
      Enabled only with the backend `dev-auth` profile. It is not secure: anyone can send any id.
    - **Later:** a JWT bearer token. The backend reads the user from the token instead of the header;
      no endpoint, parameter or response changes.
    - Either way the user is **never** a query parameter or a body field.

    ## View vs edit
    - Every user can **view** every Auditable Entity (AE).
    - Only an AE owner (or an admin) can **edit** it.
    - Every AE in a response carries `canEdit`, computed by the server. The UI shows the rest read-only.
    - Edit endpoints re-check ownership and return **403** for non-owners. 404 means the AE does not exist.

    ## scope
    - `MINE` (default): AEs where the caller is an owner. Used when a screen opens.
    - `ALL`: every AE.

    ## Search semantics
    Values inside one criterion are OR'ed; different criteria are AND'ed.
    `EXCLUDE` returns AEs that have none of the values.
    For `aeId` and `aeName` the values are AE ids (names can repeat).

    ## Filtering in the browser
    Each card has `filterValues`: the codes for every filter of the screen except aeId and aeName.
    The browser filters with `aeId`, `aeName`, `aeDescription` (search text) and `filterValues` only,
    and must give the same result as the server.

    ## Paging
    `page` starts at 1; `pageSize` defaults to 1000 and is capped at 1000.
    `aeId` is always added to the sort as a tiebreaker.

    ## Screen flow (same for every screen)
    1. On open: `GET /<screen>/filters?scope=MINE` and `POST /<screen>/aes/search?page=1` with `{}`.
    2. Load the remaining pages until `lastPage=true`, then filter in the browser.
       Until then, send the filters to `POST /<screen>/aes/search`.
    3. "All AEs": the same calls with scope `ALL`.
    4. Click an AE: `GET /<screen>/aes/{aeId}`. Edit only when `canEdit` is true.
  license:
    name: Proprietary
servers:
  - url: https://myAuditPlan/api/v1

security:
  - devUserHeader: []
  - bearerAuth: []

tags:
  - name: Shared
    description: Users, current user, saved filters and lookups used by every screen
  - name: AttributeTagging
    description: Attribute Tagging screen - review and assign Apps, Models and Third Party tags

paths:
  # ---------- Shared ----------
  /users:
    $ref: './shared/paths.yml#/users'
  /me:
    $ref: './shared/paths.yml#/me'
  /saved-filters:
    $ref: './shared/paths.yml#/savedFilters'
  /saved-filters/{id}:
    $ref: './shared/paths.yml#/savedFilterById'
  /lookups/{key}:
    $ref: './shared/paths.yml#/lookups'

  # ---------- Attribute Tagging ----------
  /attribute-tagging/aes/search:
    $ref: './attribute-tagging/paths.yml#/aesSearch'
  /attribute-tagging/filters:
    $ref: './attribute-tagging/paths.yml#/filters'
  /attribute-tagging/aes/{aeId}:
    $ref: './attribute-tagging/paths.yml#/aeDetail'
  /attribute-tagging/aes/{aeId}/tags:
    $ref: './attribute-tagging/paths.yml#/aeTags'
  /attribute-tagging/aes/{aeId}/recommendations:
    $ref: './attribute-tagging/paths.yml#/aeRecommendations'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Planned. The token carries the user id and username.
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        Temporary, until JWT is in place. The id of the user picked on the "Who are you?" screen.
        Only accepted when the backend runs with the dev-auth profile. Not secure.
