openapi: 3.0.3
info:
  title: myAuditPlan API Spec
  version: 6.0.0
  description: |
    Open API specification for myAuditPlan (mAP) - Attribute Tagging.

    ## The screen in one paragraph
    The user lands on Attribute Tagging and sees the Auditable Entities (AEs) they own: the
    AE Owner filter starts preselected with them. They change the dropdown filters to find other
    AEs. Opening an AE shows its 11 attribute types (Est, Risks, Key Legal Entities, Key Regulations,
    Key Third Parties, Key Applications, Key Models, Archer Risk Units, General Ledger / Cost Centers,
    Locations, Products), each with what is tagged now and what is recommended; in edit mode also
    All Available. An owner clicks Edit to lock the AE, adds or removes attributes in the browser,
    and clicks Update to save the whole list. Everyone sees the recommendations; after each Update
    the backend re-runs the recommendation rules.

    Some types are hierarchies. Only an attribute without children can be tagged: adding one that
    has children opens the Required Dependency dialog, where the user picks at least one child,
    level by level, until every pick has no children.

    ## APIs
    | # | API | Used for |
    |---|---|---|
    | 1 | `GET /attribute-tagging/filters` | Every dropdown and all its values |
    | 2 | `POST /attribute-tagging/aes/search` | The AE list for the selected filters |
    | 3 | `GET /attribute-tagging/aes/{aeId}` | One AE: tagged and recommended, per attribute type |
    | 4 | `POST` / `DELETE /attribute-tagging/aes/{aeId}/lock` | Take or release the edit lock |
    | 5 | `PUT /attribute-tagging/aes/{aeId}/attributes` | Update: save the full list of tagged attributes |
    | 6 | `GET /attribute-tagging/attribute-types/{type}/attributes` (+ `/{attributeId}/children`) | All Available, and the Required Dependency dialog |
    | 7 | `GET` / `POST` / `DELETE /attribute-tagging/saved-filters` | Up to 3 saved filters per user |

    ## Who is the caller
    - For now the UI sends the user's id in the `X-User-Id` header on every call. The user picks
      themselves on a "Who are you?" screen built from the AE Owner options of API 1.
      It is not secure: development and demos only.
    - Later a JWT bearer token replaces the header. No endpoint changes.
    - The user is never a query parameter or a body field.

    ## View and edit
    - Anyone can view any AE.
    - Only an AE owner can edit, and only while holding the AE's **edit lock**. An AE can have
      several owners; the first one to click Edit gets the lock, the others see it view-only
      until it is released.
    - The lock expires after **15 minutes without activity**. Taking the lock again (API 4 POST)
      and Update (API 5) both renew it. While the user is in edit mode the UI renews it every
      5 minutes, as long as the user is active.
    - Update keeps the lock, so the user can save more than once. Done, Cancel or opening another
      AE releases it (API 4 DELETE). With unsaved changes the UI warns first.

    ## Filters
    AE ID, AE Name, AE Owner (preselected), Business Area and Division - all from the AE table,
    each a plain list of values.
    Values inside one filter are OR'ed; different filters are AND'ed. There is no free-text search:
    typing inside a dropdown only narrows that dropdown's options, in the browser.
  license:
    name: Proprietary
servers:
  - url: https://myAuditPlan/api/v1

security:
  - devUserHeader: []
  - bearerAuth: []

tags:
  - name: AttributeTagging
    description: Attribute Tagging screen

paths:
  /attribute-tagging/filters:
    $ref: './attribute-tagging/paths.yml#/filters'
  /attribute-tagging/aes/search:
    $ref: './attribute-tagging/paths.yml#/aesSearch'
  /attribute-tagging/aes/{aeId}:
    $ref: './attribute-tagging/paths.yml#/aeDetail'
  /attribute-tagging/aes/{aeId}/lock:
    $ref: './attribute-tagging/paths.yml#/aeLock'
  /attribute-tagging/aes/{aeId}/attributes:
    $ref: './attribute-tagging/paths.yml#/aeAttributes'
  /attribute-tagging/attribute-types/{type}/attributes:
    $ref: './attribute-tagging/paths.yml#/attributesByType'
  /attribute-tagging/attribute-types/{type}/attributes/{attributeId}/children:
    $ref: './attribute-tagging/paths.yml#/attributeChildren'
  /attribute-tagging/saved-filters:
    $ref: './attribute-tagging/paths.yml#/savedFilters'
  /attribute-tagging/saved-filters/{id}:
    $ref: './attribute-tagging/paths.yml#/savedFilterById'

components:
  securitySchemes:
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Temporary, until JWT. The id of the user picked on the "Who are you?" screen. Not secure.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Planned. The token carries the user id.
