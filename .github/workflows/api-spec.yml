name: API spec

on:
  pull_request:
    paths: ['api/**', 'redocly.yaml', '.github/workflows/api-spec.yml']
  push:
    branches: [main]
    paths: ['api/**', 'redocly.yaml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint api/openapi.yml
        run: npx -y @redocly/cli@2 lint map
